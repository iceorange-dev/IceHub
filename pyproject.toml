[project]
name = "icehub-ostinstall"
version = "1.0.0"
description = "Windows desktop manager for OpenSteamTool, Steamless, and KRKRZ helpers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
authors = [{ name = "IceOrange" }]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
    "PyQt6>=6.4,<7",
    "PyQt6-Fluent-Widgets>=1.5,<2",
    "httpx>=0.24,<0.29",
    "psutil>=5.9,<8",
    "packaging>=24,<27",
]

[project.urls]
Homepage = "https://github.com/iceorange-dev/IceHub"
Repository = "https://github.com/iceorange-dev/IceHub"
Issues = "https://github.com/iceorange-dev/IceHub/issues"

[project.optional-dependencies]
build = ["Nuitka>=2,<3"]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "pytest-qt>=4.4,<5",
]
lint = ["ruff>=0.8,<1"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "build",
    "dist",
    "temp",
    "tools",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
